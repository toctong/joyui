# PR / main：类型检查、测试、构建（对齐成熟组件库 CI）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Catalog + registry
        run: pnpm catalog:gen && pnpm registry:gen

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (token contracts)
        run: pnpm --filter @joyui/react lint

      - name: Test
        run: pnpm test

      - name: Build packages
        run: pnpm --filter @joyui/react build && pnpm --filter @joyui/cli build

      - name: Pack dry-run (@joyui/react)
        run: pnpm --filter @joyui/react exec npm pack --dry-run

      - name: Changeset status (PR only)
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=origin/main
        continue-on-error: true
